version: "3.8"

services:
  # Redis Session Store
  redis:
    image: redis:7-alpine
    container_name: bidding-game-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - bidding-game-network
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: bidding-game-qdrant
    ports:
      - "6334:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/6333"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bidding-game-network
    restart: unless-stopped

  # Backend API (FastAPI)
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: bidding-game-backend
    ports:
      - "8001:8001"
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - LLM_API_BASE=${LLM_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen-plus}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8001
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
      - DEBUG=${DEBUG:-false}
      - GAME_MAX_ROUNDS=${GAME_MAX_ROUNDS:-8}
      - BOOTSTRAP_SAMPLES=${BOOTSTRAP_SAMPLES:-50}
      - EQUILIBRIUM_MAX_ITER=${EQUILIBRIUM_MAX_ITER:-20}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_MEMORY=false
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_TTL=${SESSION_TTL:-14400}
    volumes:
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bidding-game-network
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: bidding-game-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bidding-game-network
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local
  redis_data:
    driver: local

networks:
  bidding-game-network:
    driver: bridge
